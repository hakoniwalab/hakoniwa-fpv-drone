# Asset manifest (hakoniwa-urban-mobility docs/asset-contract.md) for the
# Master3X FPV Drone. The vehicle model is generated by tools/fpv.py from
# the Assembly Graph; this manifest declares how a Composition uses it.
schema: hakoniwa.asset/v1
id: fpv-drone-master3x
kind: vehicle
category: drone
version: 0.1.0
title: FPV Drone (Master3X)
source:
  repository: hakoniwa-fpv-drone
  generator:
    tool: tools/fpv.py
    assembly: recipes/examples/master3x-visual-demo.assembly.json
simulator: drone-core
spawn:
  # The generated report's initial_pose.mujoco_z_m for this assembly (the
  # recipe ground clearance below the lowest collision geometry). Adapters
  # check it against the report after configure.
  ground_clearance_m: 0.016
controls:
  # RC only: the FPV Drone has no api program.
  rc:
    program: ${repo:hakoniwa-fpv-drone}/tools/fpv_rc_bootstrap.py
    interpreter_args: ["-u"]
    scope: vehicle
    cwd: ${repo:hakoniwa-fpv-drone}
    args: ["${runtime.pdu_def}", "${repo:hakoniwa-drone-core}/drone_api/rc/rc_config/ps4-control.json",
           "--rc-root", "${repo:hakoniwa-drone-core}/drone_api/rc"]
