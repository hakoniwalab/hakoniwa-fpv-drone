<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>FPV Drone Composer</title>
    <link rel="stylesheet" href="./styles.css">
    <script type="importmap">
      {
        "imports": {
          "three": "./vendor/three/build/three.module.js",
          "three/addons/": "./vendor/three/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <header>
      <div><strong>FPV Drone Composer</strong><span>Catalog → Assembly Graph</span></div>
      <div class="actions"><button id="save">Save draft</button><button id="export">Export graph</button><label class="button">Import graph<input id="import" type="file" accept="application/json"></label></div>
    </header>
    <main>
      <aside id="catalog"><h2>Compatible Parts</h2><p id="catalog-hint" class="hint">最初に Frame を選択してください。</p><div id="cards"></div></aside>
      <section id="stage"><div id="viewport"></div><div id="overlay"><span id="status">Loading Catalog…</span><span>portをクリックして接続先を選択</span></div></section>
      <aside id="inspector"><h2>Selected Part</h2><div id="selection" class="empty">部品またはportを選択してください。</div><div class="section-heading"><h2>Connectable Ports</h2><button id="clear-port" class="text-button" hidden>選択解除</button></div><div id="ports" class="empty">部品を選択すると接続先portを表示します。</div><div class="section-heading"><h2>Assembly Parts</h2><span id="assembly-count"></span></div><div id="assembly-list" class="empty">まだ部品はありません。</div><details><summary>Assembly Graph JSON</summary><pre id="graph"></pre></details></aside>
    </main>
    <template id="card"><article class="card"><div class="preview"></div><div><strong></strong><small></small><p></p></div></article></template>
    <script type="module" src="./app.js?v=port-driven-v1"></script>
  </body>
</html>
