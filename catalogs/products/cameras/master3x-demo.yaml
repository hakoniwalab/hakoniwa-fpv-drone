schema_version: 1
kind: camera
items:
  - id: master3x_demo_camera_head
    name: Master3X Demo Camera
    vendor: null
    description: Photo-inspired camera-only proxy for the Master3X demo. Structural head/cage parts now belong to the frame; product identity, mass and optical values remain illustrative until the actual camera is identified.
    mass_kg: 0.045
    dimensions_m: [0.025, 0.023, 0.021]
    fov_deg: 120
    metadata:
      value_origin:
        mass_kg: legacy_demo_estimate_pending_camera_identification
        dimensions_m: photo_reference_approximation
        fov_deg: simulation_estimate
      visual_reference: user_supplied_master3x_photos
      includes: [camera]
      excludes: [frame_head, structural_camera_cage, transmitter_proxy, antennas]
    assembly_ports:
      - {id: frame_mount, role: consumer, interface: hakoniwa.generic.camera-mount, pose: {position_m: [0, 0, 0], rpy_deg: [0, 0, 0]}}
    geometry:
      visual:
        - {name: camera_case, type: box, center_m: [0, 0, 0], dimensions_m: [0.021, 0.023, 0.021], rgba: [0.06, 0.065, 0.07, 1]}
        - {name: lens_ring, type: cylinder, center_m: [0.013, 0, 0], radius_m: 0.009, length_m: 0.007, rpy_deg: [0, 90, 0], rgba: [0.3, 0.33, 0.35, 1]}
        - {name: lens_bezel, type: cylinder, center_m: [0.017, 0, 0], radius_m: 0.0075, length_m: 0.002, rpy_deg: [0, 90, 0], rgba: [0.06, 0.065, 0.07, 1]}
        - {name: lens_glass, type: ellipsoid, center_m: [0.0182, 0, 0], dimensions_m: [0.001, 0.011, 0.011], rgba: [0.045, 0.20, 0.25, 1]}
        - {name: mount_ear_right, type: box, center_m: [0, -0.013, 0], dimensions_m: [0.014, 0.003, 0.017], rgba: [0.06, 0.065, 0.07, 1]}
        - {name: mount_ear_left, type: box, center_m: [0, 0.013, 0], dimensions_m: [0.014, 0.003, 0.017], rgba: [0.06, 0.065, 0.07, 1]}
        - {name: pivot_right, type: cylinder, center_m: [0, -0.015, 0], radius_m: 0.0025, length_m: 0.002, rpy_deg: [90, 0, 0], rgba: [0.3, 0.33, 0.35, 1]}
        - {name: pivot_left, type: cylinder, center_m: [0, 0.015, 0], radius_m: 0.0025, length_m: 0.002, rpy_deg: [90, 0, 0], rgba: [0.3, 0.33, 0.35, 1]}
      inertial:
        # Preserve the previous inertial proxy until the actual camera is identified.
        - {name: mass_proxy, type: box, dimensions_m: [0.032, 0.028, 0.025]}
