item:
  id: speedybee_master3x
  name: SpeedyBee Master3X Modular Frame
  vendor: SpeedyBee
  description: Commercial modular 3–3.6-inch freestyle/racing frame. Published mass, wheelbase, motor-mount options, camera pitch and supported battery envelope are retained. Structural geometry is constrained by the Master3X Evidence Matrix where dimensions are known; unresolved planform values remain explicit estimates.
  mass_kg: 0.087
  dimensions_m: [0.171, 0.171, 0.021]
  wheelbase_m: 0.171
  motor_mount_positions_m:
    - [0.06046, -0.06046, 0.0]
    - [0.06046, 0.06046, 0.0]
    - [-0.06046, 0.06046, 0.0]
    - [-0.06046, -0.06046, 0.0]
  metadata:
    class: 3-3.6-inch
    manufacturer_product: Master3X Modular Frame
    compatible_propeller_inches: [3.0, 3.6]
    motor_mount_patterns_mm: [[9, 9], [12, 12]]
    fc_mounts_mm: [25.5]
    camera_widths_mm: [19, 20]
    maximum_battery_dimensions_mm: [67, 31, 40]
    geometry_evidence:
      plate_thickness: docs/master3x-dimension-evidence.md#confirmed--corroborated-dimensions
      stack_clearance: docs/master3x-dimension-evidence.md#conditional-derivations-usable-only-with-explicit-assumptions
      standoff_length: docs/master3x-dimension-evidence.md#confirmed--corroborated-dimensions
      camera_opening: docs/master3x-dimension-evidence.md#confirmed--corroborated-dimensions
      side_structure_photo_inference: docs/master3x-side-body-photo-inference-v1.md
      unresolved_planform: docs/master3x-dimension-evidence.md#current-yaml-values-that-are-not-yet-evidence-confirmed
    geometry_origin:
      plate_stack: manufacturer_and_corroborated_dimensions_with_estimated_planform
      arm_layout: wheelbase_derived_true_x_pending_primary_dimensions
      side_structure: manufacturer_side_plate_boundary_with_photo_inferred_taper_and_evidence_constrained_height
      front_support: manufacturer_assembly_structure_with_20mm_camera_opening_inference
      motor_feet_and_wire_guards: photo_reference_approximation
    value_origin:
      mass_kg: manufacturer
      wheelbase_m: manufacturer
      compatible_propeller_inches: manufacturer
      motor_mount_patterns_mm: manufacturer
      fc_mounts_mm: manufacturer
      camera_widths_mm: manufacturer
      maximum_battery_dimensions_mm: manufacturer
      dimensions_m: simulation_envelope_from_wheelbase_and_published_stack_height
      motor_mount_positions_m: derived_true_x_from_wheelbase_under_unverified_square_assumption
      motor_mount_interface: manufacturer
      battery_mount_pose: derived_from_top_plate_surface_and_pad_proxy
      camera_mount_pose: simulation_estimate
      electronics_mount_pose: derived_from_middle_plate_mounting_surface
      geometry: evidence_matrix_constrained_with_photo_inferred_side_body_and_estimated_planform
  assembly_ports:
    - {id: motor_mount_1, role: provider, interface: fpv.motor-mount.9x9-or-12x12, pose: {position_m: [0.06046, -0.06046, 0.0], rpy_deg: [0, 0, 0]}}
    - {id: motor_mount_2, role: provider, interface: fpv.motor-mount.9x9-or-12x12, pose: {position_m: [0.06046, 0.06046, 0.0], rpy_deg: [0, 0, 0]}}
    - {id: motor_mount_3, role: provider, interface: fpv.motor-mount.9x9-or-12x12, pose: {position_m: [-0.06046, 0.06046, 0.0], rpy_deg: [0, 0, 0]}}
    - {id: motor_mount_4, role: provider, interface: fpv.motor-mount.9x9-or-12x12, pose: {position_m: [-0.06046, -0.06046, 0.0], rpy_deg: [0, 0, 0]}}
    - {id: battery_mount, role: provider, interface: hakoniwa.generic.battery-mount, pose: {position_m: [-0.008, 0, 0.0215], rpy_deg: [0, 0, 0]}}
    - {id: camera_mount, role: provider, interface: hakoniwa.generic.camera-mount, pose: {position_m: [0.067, 0, 0.014], rpy_deg: [0, 0, 0]}}
    - {id: electronics_mount, role: provider, interface: hakoniwa.generic.electronics-mount, pose: {position_m: [0, 0, 0.0075], rpy_deg: [0, 0, 0]}}
    - {id: landing_gear_mount, role: provider, interface: hakoniwa.generic.landing-gear-mount, pose: {position_m: [0, 0, 0], rpy_deg: [0, 0, 0]}}
    - {id: accessory_mount, role: provider, interface: hakoniwa.generic.accessory-mount, capacity: 8, pose: {position_m: [0, 0, 0.0105], rpy_deg: [0, 0, 0]}}
  geometry:
    visual:
      # Plate thicknesses are evidence-backed. Planform L/W remains estimated.
      - {name: bottom_plate, type: box, center_m: [0.000, 0, 0.000], dimensions_m: [0.098, 0.036, 0.002], rgba: [0.055, 0.065, 0.075, 1]}
      - {name: middle_plate, type: box, center_m: [0.000, 0, 0.0065], dimensions_m: [0.086, 0.034, 0.002], rgba: [0.060, 0.070, 0.080, 1]}
      # The 11 mm stack-height constraint is interpreted as the clearance from
      # the middle-plate upper surface to the top-plate lower surface.
      - {name: top_plate, type: box, center_m: [0.000, 0, 0.0195], dimensions_m: [0.091, 0.030, 0.002], rgba: [0.055, 0.065, 0.075, 1]}
      - {name: top_nose, type: box, center_m: [0.045, 0, 0.0195], dimensions_m: [0.022, 0.026, 0.002], rgba: [0.055, 0.065, 0.075, 1]}
      - {name: battery_pad_front, type: box, center_m: [0.013, 0, 0.0210], dimensions_m: [0.012, 0.024, 0.001], rgba: [0.025, 0.028, 0.032, 1]}
      - {name: battery_pad_rear, type: box, center_m: [-0.023, 0, 0.0210], dimensions_m: [0.012, 0.024, 0.001], rgba: [0.025, 0.028, 0.032, 1]}

      # Front support stays an inferred primitive model, but its inner opening
      # is constrained to 20 mm, the larger published camera installation width.
      - {name: front_support_bottom, type: box, center_m: [0.055, 0, 0.002], dimensions_m: [0.030, 0.026, 0.004], rgba: [0.055, 0.065, 0.075, 1]}
      - {name: front_support_right, type: box, center_m: [0.057, -0.0115, 0.012], dimensions_m: [0.028, 0.003, 0.022], rpy_deg: [0, -8, 0], rgba: [0.95, 0.72, 0.03, 1]}
      - {name: front_support_left, type: box, center_m: [0.057, 0.0115, 0.012], dimensions_m: [0.028, 0.003, 0.022], rpy_deg: [0, -8, 0], rgba: [0.95, 0.72, 0.03, 1]}
      - {name: front_support_top, type: box, center_m: [0.055, 0, 0.022], dimensions_m: [0.024, 0.026, 0.003], rgba: [0.055, 0.065, 0.075, 1]}

      # Official photos show the injection-molded side body as a tapered volume,
      # not a constant-thickness flat plate. Three stacked tiers preserve the
      # evidence-constrained 11 mm bay while tapering inward toward the top.
      - {name: side_plate_right, type: box, center_m: [0.000, -0.0170, 0.0095], dimensions_m: [0.068, 0.006, 0.004], rgba: [0.95, 0.72, 0.03, 1]}
      - {name: side_plate_left, type: box, center_m: [0.000, 0.0170, 0.0095], dimensions_m: [0.068, 0.006, 0.004], rgba: [0.95, 0.72, 0.03, 1]}
      - {name: side_plate_mid_right, type: box, center_m: [0.000, -0.0165, 0.0130], dimensions_m: [0.062, 0.005, 0.003], rgba: [0.97, 0.73, 0.035, 1]}
      - {name: side_plate_mid_left, type: box, center_m: [0.000, 0.0165, 0.0130], dimensions_m: [0.062, 0.005, 0.003], rgba: [0.97, 0.73, 0.035, 1]}
      - {name: side_plate_upper_right, type: box, center_m: [0.000, -0.0160, 0.0165], dimensions_m: [0.054, 0.004, 0.004], rgba: [0.95, 0.72, 0.03, 1]}
      - {name: side_plate_upper_left, type: box, center_m: [0.000, 0.0160, 0.0165], dimensions_m: [0.054, 0.004, 0.004], rgba: [0.95, 0.72, 0.03, 1]}

      # Front/rear ramps and diagonal ribs approximate the molded wedge silhouette
      # visible in SpeedyBee product photos. These are rooted visual inferences,
      # not manufacturer dimensions.
      - {name: side_front_ramp_right, type: box, center_m: [0.030, -0.0165, 0.0130], dimensions_m: [0.016, 0.005, 0.004], rpy_deg: [0, -18, 0], rgba: [0.92, 0.66, 0.02, 1]}
      - {name: side_front_ramp_left, type: box, center_m: [0.030, 0.0165, 0.0130], dimensions_m: [0.016, 0.005, 0.004], rpy_deg: [0, -18, 0], rgba: [0.92, 0.66, 0.02, 1]}
      - {name: side_rear_ramp_right, type: box, center_m: [-0.030, -0.0165, 0.0125], dimensions_m: [0.016, 0.005, 0.004], rpy_deg: [0, 18, 0], rgba: [0.92, 0.66, 0.02, 1]}
      - {name: side_rear_ramp_left, type: box, center_m: [-0.030, 0.0165, 0.0125], dimensions_m: [0.016, 0.005, 0.004], rpy_deg: [0, 18, 0], rgba: [0.92, 0.66, 0.02, 1]}
      - {name: side_nose_bridge_right, type: box, center_m: [0.041, -0.0145, 0.0140], dimensions_m: [0.014, 0.005, 0.004], rpy_deg: [0, -12, 0], rgba: [0.95, 0.72, 0.03, 1]}
      - {name: side_nose_bridge_left, type: box, center_m: [0.041, 0.0145, 0.0140], dimensions_m: [0.014, 0.005, 0.004], rpy_deg: [0, -12, 0], rgba: [0.95, 0.72, 0.03, 1]}
      - {name: side_brace_right_front, type: box, center_m: [0.016, -0.0185, 0.013], dimensions_m: [0.004, 0.003, 0.009], rpy_deg: [0, -24, 0], rgba: [0.80, 0.58, 0.02, 1]}
      - {name: side_brace_right_rear, type: box, center_m: [-0.016, -0.0185, 0.013], dimensions_m: [0.004, 0.003, 0.009], rpy_deg: [0, 24, 0], rgba: [0.80, 0.58, 0.02, 1]}
      - {name: side_brace_left_front, type: box, center_m: [0.016, 0.0185, 0.013], dimensions_m: [0.004, 0.003, 0.009], rpy_deg: [0, -24, 0], rgba: [0.80, 0.58, 0.02, 1]}
      - {name: side_brace_left_rear, type: box, center_m: [-0.016, 0.0185, 0.013], dimensions_m: [0.004, 0.003, 0.009], rpy_deg: [0, 24, 0], rgba: [0.80, 0.58, 0.02, 1]}

      # Manufacturer installation material identifies M2x11 mm aluminum standoffs.
      - {name: standoff_rear_right, type: cylinder, center_m: [-0.035, -0.012, 0.013], radius_m: 0.0018, length_m: 0.011, rgba: [0.95, 0.67, 0.025, 1]}
      - {name: standoff_rear_left, type: cylinder, center_m: [-0.035, 0.012, 0.013], radius_m: 0.0018, length_m: 0.011, rgba: [0.95, 0.67, 0.025, 1]}
      - {name: standoff_front_right, type: cylinder, center_m: [0.035, -0.012, 0.013], radius_m: 0.0018, length_m: 0.011, rgba: [0.95, 0.67, 0.025, 1]}
      - {name: standoff_front_left, type: cylinder, center_m: [0.035, 0.012, 0.013], radius_m: 0.0018, length_m: 0.011, rgba: [0.95, 0.67, 0.025, 1]}

      # Arm and motor-center geometry remains unchanged until primary dimensions
      # beyond the published wheelbase are available.
      - {name: arm_front_right, type: box, center_m: [0.037, -0.037, 0], dimensions_m: [0.0664, 0.009, 0.004], rpy_deg: [0, 0, -45], rgba: [0.08, 0.09, 0.10, 1.0]}
      - {name: arm_front_left, type: box, center_m: [0.037, 0.037, 0], dimensions_m: [0.0664, 0.009, 0.004], rpy_deg: [0, 0, 45], rgba: [0.08, 0.09, 0.10, 1.0]}
      - {name: arm_rear_left, type: box, center_m: [-0.037, 0.037, 0], dimensions_m: [0.0664, 0.009, 0.004], rpy_deg: [0, 0, -45], rgba: [0.08, 0.09, 0.10, 1.0]}
      - {name: arm_rear_right, type: box, center_m: [-0.037, -0.037, 0], dimensions_m: [0.0664, 0.009, 0.004], rpy_deg: [0, 0, 45], rgba: [0.08, 0.09, 0.10, 1.0]}

      - {name: foot_rear_right, type: cylinder, center_m: [-0.06046, -0.06046, -0.004], radius_m: 0.0105, length_m: 0.004, rgba: [0.95, 0.67, 0.025, 1]}
      - {name: motor_pad_rear_right, type: cylinder, center_m: [-0.06046, -0.06046, 0], radius_m: 0.010, length_m: 0.004, rgba: [0.055, 0.065, 0.075, 1]}
      - {name: wire_guard_rear_right, type: box, center_m: [-0.03990, -0.03990, 0.003], dimensions_m: [0.029, 0.006, 0.003], rpy_deg: [0, 0, 45], rgba: [0.95, 0.67, 0.025, 1]}
      - {name: foot_rear_left, type: cylinder, center_m: [-0.06046, 0.06046, -0.004], radius_m: 0.0105, length_m: 0.004, rgba: [0.95, 0.67, 0.025, 1]}
      - {name: motor_pad_rear_left, type: cylinder, center_m: [-0.06046, 0.06046, 0], radius_m: 0.010, length_m: 0.004, rgba: [0.055, 0.065, 0.075, 1]}
      - {name: wire_guard_rear_left, type: box, center_m: [-0.03990, 0.03990, 0.003], dimensions_m: [0.029, 0.006, 0.003], rpy_deg: [0, 0, -45], rgba: [0.95, 0.67, 0.025, 1]}
      - {name: foot_front_right, type: cylinder, center_m: [0.06046, -0.06046, -0.004], radius_m: 0.0105, length_m: 0.004, rgba: [0.95, 0.67, 0.025, 1]}
      - {name: motor_pad_front_right, type: cylinder, center_m: [0.06046, -0.06046, 0], radius_m: 0.010, length_m: 0.004, rgba: [0.055, 0.065, 0.075, 1]}
      - {name: wire_guard_front_right, type: box, center_m: [0.03990, -0.03990, 0.003], dimensions_m: [0.029, 0.006, 0.003], rpy_deg: [0, 0, -45], rgba: [0.95, 0.67, 0.025, 1]}
      - {name: foot_front_left, type: cylinder, center_m: [0.06046, 0.06046, -0.004], radius_m: 0.0105, length_m: 0.004, rgba: [0.95, 0.67, 0.025, 1]}
      - {name: motor_pad_front_left, type: cylinder, center_m: [0.06046, 0.06046, 0], radius_m: 0.010, length_m: 0.004, rgba: [0.055, 0.065, 0.075, 1]}
      - {name: wire_guard_front_left, type: box, center_m: [0.03990, 0.03990, 0.003], dimensions_m: [0.029, 0.006, 0.003], rpy_deg: [0, 0, 45], rgba: [0.95, 0.67, 0.025, 1]}
    collision:
      # Deliberately coarse contact proxies. They cover the plate stack, arms,
      # and motor feet without making each visual detail a collision surface.
      # Their lower face establishes the automatic ground-placement reference.
      - {name: core_contact, type: box, center_m: [0.000, 0, 0.008], dimensions_m: [0.100, 0.040, 0.018]}
      - {name: arm_front_right_contact, type: box, center_m: [0.037, -0.037, 0], dimensions_m: [0.0664, 0.010, 0.005], rpy_deg: [0, 0, -45]}
      - {name: arm_front_left_contact, type: box, center_m: [0.037, 0.037, 0], dimensions_m: [0.0664, 0.010, 0.005], rpy_deg: [0, 0, 45]}
      - {name: arm_rear_left_contact, type: box, center_m: [-0.037, 0.037, 0], dimensions_m: [0.0664, 0.010, 0.005], rpy_deg: [0, 0, -45]}
      - {name: arm_rear_right_contact, type: box, center_m: [-0.037, -0.037, 0], dimensions_m: [0.0664, 0.010, 0.005], rpy_deg: [0, 0, 45]}
      - {name: foot_front_right_contact, type: cylinder, center_m: [0.06046, -0.06046, -0.004], radius_m: 0.0105, length_m: 0.004}
      - {name: foot_front_left_contact, type: cylinder, center_m: [0.06046, 0.06046, -0.004], radius_m: 0.0105, length_m: 0.004}
      - {name: foot_rear_left_contact, type: cylinder, center_m: [-0.06046, 0.06046, -0.004], radius_m: 0.0105, length_m: 0.004}
      - {name: foot_rear_right_contact, type: cylinder, center_m: [-0.06046, -0.06046, -0.004], radius_m: 0.0105, length_m: 0.004}
    inertial:
      # Keep the existing inertial proxy unchanged until mass distribution is evidenced.
      - {name: mass_proxy, type: box, dimensions_m: [0.120, 0.120, 0.018]}
