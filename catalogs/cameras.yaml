schema_version: 1
kind: camera
items:
  - id: generic_fpv_camera
    name: Generic FPV Camera
    vendor: null
    description: Generic camera mass, envelope and horizontal-use viewer FOV metadata.
    mass_kg: 0.012
    dimensions_m: [0.020, 0.020, 0.020]
    fov_deg: 120
    metadata:
      viewer_backend: hakoniwa-threejs-drone
      value_origin: generic_example
    assembly_ports:
      - {id: frame_mount, role: consumer, interface: hakoniwa.generic.camera-mount, pose: {position_m: [0, 0, 0], rpy_deg: [0, 0, 0]}}
    geometry:
      inertial:
        - {name: mass_proxy, type: box, dimensions_m: [0.020, 0.020, 0.020]}

  - id: runcam_phoenix2
    name: RunCam Phoenix 2
    vendor: RunCam
    description: Commercial analog FPV camera using the 19 mm side-mount format. Published mass, envelope and optical FOV are retained from RunCam.
    mass_kg: 0.009
    dimensions_m: [0.019, 0.019, 0.019]
    fov_deg: 155
    metadata:
      manufacturer_product: RunCam Phoenix 2
      source_urls:
        - https://shop.runcam.com/runcam-phoenix-2/
        - https://www.runcam.com/download/Phoenix2/Phoenix_2_Manual.pdf
      lens: 2.1mm_M12
      viewer_backend: hakoniwa-threejs-drone
      value_origin:
        mass_kg: manufacturer
        dimensions_m: manufacturer
        fov_deg: manufacturer
    assembly_ports:
      - {id: frame_mount, role: consumer, interface: fpv.camera-mount.19mm-m2, pose: {position_m: [0, 0, 0], rpy_deg: [0, 0, 0]}}
    geometry:
      visual:
        - {name: camera_body, type: box, dimensions_m: [0.019, 0.019, 0.019], rgba: [0.12, 0.12, 0.13, 1.0]}
      inertial:
        - {name: mass_proxy, type: box, dimensions_m: [0.019, 0.019, 0.019]}
