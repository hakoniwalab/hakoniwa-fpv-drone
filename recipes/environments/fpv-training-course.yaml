schema_version: 1

# The aircraft Recipe describes one vehicle. This file independently describes
# the MuJoCo venue in which that vehicle is evaluated.
visual:
  sky_rgba: [0.62, 0.78, 0.95, 1.0]
  haze_rgba: [0.72, 0.84, 0.96, 1.0]
  headlight_ambient: [0.55, 0.55, 0.55]
  headlight_diffuse: [0.80, 0.80, 0.80]

ground:
  size_m: [30.0, 30.0]
  rgba: [0.30, 0.42, 0.25, 1.0]

# Ground remains grippy for takeoff and landing. The vehicle and course
# obstacles are deliberately slippery so a powered FPV aircraft glances or
# slides after impact instead of being held against a gate by static friction.
contact:
  ground_friction: [0.80, 0.02, 0.001]
  vehicle_friction: [0.15, 0.002, 0.0001]
  obstacle_friction: [0.15, 0.002, 0.0001]
  obstacle_condim: 3

lights:
  - name: key-light
    pos_m: [0.0, -5.0, 12.0]
    direction: [0.0, 0.25, -1.0]
    diffuse: [0.95, 0.95, 0.92]
    ambient: [0.25, 0.25, 0.25]
  - name: fill-light
    pos_m: [8.0, 4.0, 7.0]
    direction: [-0.7, -0.3, -1.0]
    diffuse: [0.55, 0.65, 0.80]
    ambient: [0.12, 0.12, 0.16]

# Gate center_m is the center of its open area. yaw_deg rotates the gate about
# world +Z. Boxes use full dimensions, not MuJoCo half sizes.
obstacles:
  - {name: start-gate, type: gate, center_m: [4.0, 0.0, 1.5], yaw_deg: 0, inner_width_m: 2.4, inner_height_m: 2.2, bar_thickness_m: 0.18, depth_m: 0.25, rgba: [1.0, 0.25, 0.05, 1.0]}
  - {name: gate-left, type: gate, center_m: [8.0, 4.0, 1.8], yaw_deg: 35, inner_width_m: 2.2, inner_height_m: 2.6, bar_thickness_m: 0.18, depth_m: 0.25, rgba: [0.1, 0.75, 1.0, 1.0]}
  - {name: gate-right, type: gate, center_m: [12.0, -2.5, 1.4], yaw_deg: -30, inner_width_m: 2.0, inner_height_m: 2.0, bar_thickness_m: 0.16, depth_m: 0.25, rgba: [0.95, 0.15, 0.75, 1.0]}
  - {name: high-gate, type: gate, center_m: [15.0, 3.0, 3.8], yaw_deg: 15, inner_width_m: 2.5, inner_height_m: 2.2, bar_thickness_m: 0.20, depth_m: 0.30, rgba: [0.95, 0.75, 0.05, 1.0]}
  - {name: return-gate, type: gate, center_m: [7.0, -6.0, 2.0], yaw_deg: 90, inner_width_m: 2.4, inner_height_m: 2.5, bar_thickness_m: 0.18, depth_m: 0.25, rgba: [0.35, 1.0, 0.25, 1.0]}
  - {name: slalom-1, type: pylon, center_m: [5.5, -3.0, 1.0], radius_m: 0.15, height_m: 2.0, rgba: [1.0, 0.45, 0.05, 1.0]}
  - {name: slalom-2, type: pylon, center_m: [7.5, -3.8, 1.25], radius_m: 0.15, height_m: 2.5, rgba: [1.0, 0.85, 0.05, 1.0]}
  - {name: slalom-3, type: pylon, center_m: [9.5, -4.5, 1.5], radius_m: 0.15, height_m: 3.0, rgba: [1.0, 0.45, 0.05, 1.0]}
  - {name: low-bar, type: box, center_m: [11.0, 3.5, 0.65], yaw_deg: 10, dimensions_m: [3.5, 0.3, 1.3], rgba: [0.20, 0.30, 0.90, 1.0]}
  - {name: tower, type: box, center_m: [17.0, -4.0, 2.5], yaw_deg: 20, dimensions_m: [1.2, 1.2, 5.0], rgba: [0.35, 0.38, 0.45, 1.0]}
