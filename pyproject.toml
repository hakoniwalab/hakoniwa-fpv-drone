[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hakoniwa-fpv-drone"
version = "0.1.0"
description = "Catalog-driven FPV drone vehicle model generator for Hakoniwa and MuJoCo"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
classifiers = [
  "License :: OSI Approved :: MIT License",
]
dependencies = [
  "PyYAML>=6.0",
]

[project.scripts]
fpv-drone = "fpv_drone_generator.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fpv_drone_generator = ["contracts/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
