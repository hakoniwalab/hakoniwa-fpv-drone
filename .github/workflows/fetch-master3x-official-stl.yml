name: fetch-master3x-official-stl

on:
  pull_request:
    branches: [main]

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download official Master3X STL files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p master3x-official-stl
          cd master3x-official-stl
          curl -fL --retry 3 -o '01-Master3X-Crossfire-915-Receiver-Bay_TPU_M2_8.stl' 'https://spcdn.speedybee.cn/cdn/254143810114686976.stl?attname=Master3X-Crossfire-915-Receiver-Bay%28TPU%2CM2_8%29.stl'
          curl -fL --retry 3 -o '02-Master3X-Front-Scoop-for-915-Receiver_TPU.stl' 'https://spcdn.speedybee.cn/cdn/254143854888882176.stl?attname=Master3X-Front-Scoop-for-915-Receiver%28TPU%29.stl'
          curl -fL --retry 3 -o '03-Master3X-Nose-Bottom-Protection-Plate_TPU.stl' 'https://spcdn.speedybee.cn/cdn/254143900564852736.stl?attname=Master3X-Nose-Bottom-Protection-Plate%28TPU%29.stl'
          curl -fL --retry 3 -o '04-Master3X-Nose-GoPro-Mount-Base-with-M3-Holes_TPU_M2_8-Screws.stl' 'https://spcdn.speedybee.cn/cdn/254143945192247296.stl?attname=Master3X-Nose-GoPro-Mount-Base-with-M3-Holes%28TPU%2CM2_8-Screws%29.stl'
          curl -fL --retry 3 -o '05-Master3X-Rear-Selfie-Mount-with-M3-Mounting-Holes_TPU.stl' 'https://spcdn.speedybee.cn/cdn/254144006370365440.stl?attname=Master3X-Rear-Selfie-Mount-with-M3-Mounting-Holes%28TPU%29.stl'
          curl -fL --retry 3 -o '06-Master3X-Motor-Pad_TPU_M2_10.stl' 'https://spcdn.speedybee.cn/cdn/254144051643682816.stl?attname=Master3X-Motor-Pad%28TPU%2CM2_10%29.stl'
          curl -fL --retry 3 -o '07-Master3X-Selfie-Stick-with-M3-Mounting-Holes-50mm-80mm_PLA.stl' 'https://spcdn.speedybee.cn/cdn/254144099144175616.stl?attname=Master3X-Selfie-Stick-with-M3-Mounting-Holes-50mm-80mm%28PLA%29.stl'
          curl -fL --retry 3 -o '08-Master3X-Type-A-Shark-Fin_TPU-M2-8.stl' 'https://spcdn.speedybee.cn/cdn/254144147441586176.stl?attname=Master3X-Type-A-Shark-Fin%28TPU-M2-8%29.stl'
          curl -fL --retry 3 -o '09-Master3X-V-Type-Shark-Fin_TPU-M2-8-Screws.stl' 'https://spcdn.speedybee.cn/cdn/254144197127311360.stl?attname=Master3X-V-Type-Shark-Fin%28TPU-M2-8-Screws%29.stl'
          curl -fL --retry 3 -o '10-Master3X-BEE25-Intake-Antenna-Mount-L_TPU.stl' 'https://spcdn.speedybee.cn/cdn/254144288626053120.stl?attname=Master3X-BEE25%E2%80%93Intake-Antenna-Mount-L%28TPU%29.stl'
          curl -fL --retry 3 -o '11-Master3X-BEE25-Intake-Antenna-Mount-R_TPU.stl' 'https://spcdn.speedybee.cn/cdn/254144430976536576.stl?attname=Master3X_BEE25%E2%80%93Intake-Antenna-Mount-R%28TPU%29.stl'
          curl -fL --retry 3 -o '12-Master3X-121GPS-Printed-Part_TPU-M2-8.stl' 'https://spcdn.speedybee.cn/cdn/254144480871976960.stl?attname=Master3X-121GPS-Printed-Part%28TPU-M2-8%29.stl'
          curl -fL --retry 3 -o '13-Master3X-181GPS_TPU-M2-8.stl' 'https://spcdn.speedybee.cn/cdn/254144526413729792.stl?attname=Master3X-181GPS%28TPU-M2-8%29.stl'
          curl -fL --retry 3 -o '14-Master3X-Front-Scoop-for-2.4G-Receiver.stl' 'https://spcdn.speedybee.cn/cdn/254144576669880320.stl?attname=Master3XFront-Scoop-for-2.4G-Receiver.stl'
          curl -fL --retry 3 -o '15-O4P-Aluminum-Alloy-Nose-Cone-Antenna-Sleeve.stl' 'https://spcdn.speedybee.cn/cdn/254144617677590528.stl?attname=O4P-Aluminum-Alloy-Nose-Cone%E2%80%93Antenna-Sleeve.stl'
          curl -fL --retry 3 -o '16-Gimbal-camera-limit-stop-3D-printed-part.stl' 'https://spcdn.speedybee.cn/cdn/254144655690567680.STL?attname=Gimbal-camera-limit-stop-3D-printed-part.STL'
          curl -fL --retry 3 -o '17-O4WA-Updated-Aluminum-Alloy-Antenna-Mount-TPU.stl' 'https://spcdn.speedybee.cn/cdn/293198260783288320.STL?attname=O4WA+%E2%80%93+Updated+Aluminum+Alloy+Antenna+Mount+%E2%80%93+TPU.STL'
          sha256sum *.stl > SHA256SUMS.txt

      - name: Upload official STL set
        uses: actions/upload-artifact@v4
        with:
          name: master3x-official-stl
          path: master3x-official-stl/
          if-no-files-found: error
          retention-days: 1

      - name: Install test dependencies
        run: python -m pip install -e '.[showroom]'

      - name: Run Master3X regression tests
        run: python -m unittest tests.test_master3x_rigid_body_model

      - name: Prepare managed showroom
        run: python tools/fpv-catalog.py prepare

      - name: Regenerate Master3X frame GLB
        run: python tools/fpv-catalog.py export-glb frame speedybee_master3x

      - name: Upload regenerated Master3X GLB
        uses: actions/upload-artifact@v4
        with:
          name: master3x-regenerated-glb
          path: |
            build/catalog-showroom/glb/frame/speedybee_master3x.glb
            build/catalog-showroom/glb/manifest.json
          if-no-files-found: error
          retention-days: 1
