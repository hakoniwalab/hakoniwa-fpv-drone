schema_version: 1
kind: assembly-interface-definition
items:
  - id: motor-mount
    name: Motor mount
    description: Mechanical mounting relation between a frame and a motor.
    domain: mechanical
    roles: [provider, consumer]
    parameters:
      - id: pattern_x_mm
        description: Horizontal spacing between mounting-hole centers.
        required: false
        schema: {type: number, exclusiveMinimum: 0}
      - id: pattern_y_mm
        description: Vertical spacing between mounting-hole centers.
        required: false
        schema: {type: number, exclusiveMinimum: 0}
      - id: hole_diameter_mm
        description: Nominal mounting-hole diameter when known.
        required: false
        schema: {type: number, exclusiveMinimum: 0}
      - id: pattern_options_mm
        description: Alternative square mounting-hole spacings accepted by one frame mount.
        required: false
        schema:
          type: array
          minItems: 1
          items:
            type: array
            minItems: 2
            maxItems: 2
            items: {type: number, exclusiveMinimum: 0}

  - id: propeller-shaft
    name: Propeller shaft
    description: Rotational mounting relation between a motor and a propeller.
    domain: mechanical
    roles: [provider, consumer]
    parameters:
      - id: shaft_diameter_mm
        description: Nominal motor-shaft / propeller-bore diameter.
        required: false
        schema: {type: number, exclusiveMinimum: 0}

  - id: battery-mount
    name: Battery mount
    description: Adjustable mounting zone for a battery on a frame.
    domain: mechanical
    roles: [provider, consumer]
    parameters: []

  - id: camera-mount
    name: Camera mount
    description: Adjustable mounting zone for an FPV camera on a frame.
    domain: mechanical
    roles: [provider, consumer]
    parameters:
      - id: camera_width_mm
        description: Nominal camera body width accepted by the mount.
        required: false
        schema: {type: number, exclusiveMinimum: 0}
      - id: fastener_nominal_diameter_mm
        description: Nominal side-fastener diameter when known.
        required: false
        schema: {type: number, exclusiveMinimum: 0}

  - id: electronics-mount
    name: Electronics mount
    description: Mounting zone for an onboard controller or electronics module.
    domain: mechanical
    roles: [provider, consumer]
    parameters: []

  - id: landing-gear-mount
    name: Landing gear mount
    description: Mounting relation between a frame and landing gear.
    domain: mechanical
    roles: [provider, consumer]
    parameters: []

  - id: accessory-mount
    name: Accessory mount
    description: Adjustable mounting zone for an attachment or payload.
    domain: mechanical
    roles: [provider, consumer]
    parameters: []
