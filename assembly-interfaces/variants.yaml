  - id: fpv.propeller-shaft.t-mount-1.5mm
    name: FPV 1.5 mm T-mount propeller attachment
    description: Three-bolt T-mount propeller attachment with a nominal 1.5 mm center feature.
    interface: propeller-shaft
    parameters:
      shaft_diameter_mm: 1.5
    evidence_status: verified
    metadata:
      source_urls:
        - https://www.speedybee.com/accessories-for-speedybee-master-3x/
