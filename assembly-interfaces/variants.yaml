schema_version: 1
kind: assembly-interface-variant
items:
  - id: hakoniwa.generic.motor-mount
    name: Hakoniwa generic motor mount
    description: Simulation-only generic motor mount; no real bolt pattern is claimed.
    interface: motor-mount
    parameters: {}
    evidence_status: declared

  - id: fpv.motor-mount.16x16
    name: FPV 16x16 mm motor mount
    description: Common 5-inch FPV motor mounting pattern with 16 mm hole-center spacing.
    interface: motor-mount
    parameters:
      pattern_x_mm: 16
      pattern_y_mm: 16
      hole_diameter_mm: 3
    evidence_status: verified
    metadata:
      source_urls:
        - https://www.speedybee.com/speedybee-master-5-v2-frame/
        - https://shop.iflight.com/index.php?product_id=3371&route=product%2Fproduct

  - id: fpv.motor-mount.9x9-or-12x12
    name: FPV 9x9 mm or 12x12 mm motor mount
    description: Master3X frame motor-mount pattern accepting either 9x9 mm or 12x12 mm M2 mounting holes.
    interface: motor-mount
    parameters:
      pattern_options_mm: [[9, 9], [12, 12]]
      hole_diameter_mm: 2
    evidence_status: verified
    metadata:
      source_urls:
        - https://www.speedybee.com/speedybee-master3x-frame/
        - https://spcdn.speedybee.cn/cdn/142107666636869632.pdf?attname=sbee_master3x_frame_manual-en.pdf

  - id: hakoniwa.generic.propeller-shaft
    name: Hakoniwa generic propeller shaft
    description: Simulation-only generic motor-to-propeller shaft; no real shaft size is claimed.
