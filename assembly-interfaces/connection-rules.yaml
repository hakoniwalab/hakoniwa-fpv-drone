schema_version: 1
kind: assembly-connection-rule
items:
  - id: generic-motor-mount
    provider_interface: hakoniwa.generic.motor-mount
    consumer_interface: hakoniwa.generic.motor-mount
    status: compatible
    description: Snap a motor to its frame-owned motor mount; pose is fixed.
    adjustment:
      translation_axes: []
      rotation_axes: []
    metadata: {scope: simulation_only}

  - id: fpv-motor-mount-16x16
    provider_interface: fpv.motor-mount.16x16
    consumer_interface: fpv.motor-mount.16x16
    status: compatible
    description: Match a 16x16 mm FPV frame motor mount with a 16x16 mm motor base.
    adjustment:
      translation_axes: []
      rotation_axes: []
    metadata: {scope: dimensional_mechanical}

  - id: fpv-motor-mount-9x9-or-12x12
    provider_interface: fpv.motor-mount.9x9-or-12x12
    consumer_interface: fpv.motor-mount.9x9-or-12x12
    status: compatible
    description: Match the Master3X frame mount with a motor supporting its 9x9 mm or 12x12 mm M2 pattern.
    adjustment:
      translation_axes: []
      rotation_axes: []
    metadata: {scope: dimensional_mechanical}

  - id: generic-propeller-shaft
    provider_interface: hakoniwa.generic.propeller-shaft
    consumer_interface: hakoniwa.generic.propeller-shaft
    status: compatible
    description: Snap a propeller to its motor-owned shaft; pose is fixed.
    adjustment:
      translation_axes: []
      rotation_axes: []
    metadata: {scope: simulation_only}

  - id: fpv-propeller-shaft-5mm
    provider_interface: fpv.propeller-shaft.5mm
    consumer_interface: fpv.propeller-shaft.5mm
    status: compatible
    description: Match a 5 mm motor shaft with a 5 mm propeller bore.
    adjustment:
      translation_axes: []
      rotation_axes: []
    metadata: {scope: dimensional_mechanical}

  - id: fpv-propeller-shaft-t-mount-1-5mm
    provider_interface: fpv.propeller-shaft.t-mount-1.5mm
    consumer_interface: fpv.propeller-shaft.t-mount-1.5mm
    status: compatible
    description: Match a 1.5 mm T-mount motor attachment with its matching propeller.
    adjustment:
      translation_axes: []
      rotation_axes: []
    metadata: {scope: dimensional_mechanical}

  - id: generic-battery-mount
    provider_interface: hakoniwa.generic.battery-mount
    consumer_interface: hakoniwa.generic.battery-mount
    status: compatible
    description: Snap a battery to the frame battery zone, then allow local adjustment.
    adjustment:
      translation_axes: [x, y, z]
      rotation_axes: [yaw]
      translation_limits_m: [0.08, 0.06, 0.04]
      rotation_limits_deg: [0, 0, 180]
    metadata: {scope: simulation_only}

  - id: generic-camera-mount
    provider_interface: hakoniwa.generic.camera-mount
    consumer_interface: hakoniwa.generic.camera-mount
    status: compatible
    description: Snap a camera to the frame camera zone, then allow local adjustment.
    adjustment:
      translation_axes: [x, y, z]
      rotation_axes: [roll, pitch, yaw]
      translation_limits_m: [0.05, 0.04, 0.03]
      rotation_limits_deg: [20, 45, 30]
    metadata: {scope: simulation_only}

  - id: fpv-camera-mount-19mm-m2
    provider_interface: fpv.camera-mount.19mm-m2
    consumer_interface: fpv.camera-mount.19mm-m2
    status: compatible
    description: Mount a 19 mm FPV camera between matching M2 side plates; pitch remains adjustable.
    adjustment:
      translation_axes: []
      rotation_axes: [pitch]
      rotation_limits_deg: [0, 60, 0]
    metadata: {scope: dimensional_mechanical}

  - id: generic-electronics-mount
    provider_interface: hakoniwa.generic.electronics-mount
    consumer_interface: hakoniwa.generic.electronics-mount
    status: compatible
    description: Snap an electronics module to the frame electronics zone, then allow local adjustment.
    adjustment:
      translation_axes: [x, y, z]
      rotation_axes: [yaw]
      translation_limits_m: [0.05, 0.05, 0.03]
      rotation_limits_deg: [0, 0, 180]
    metadata: {scope: simulation_only}

  - id: generic-landing-gear-mount
    provider_interface: hakoniwa.generic.landing-gear-mount
    consumer_interface: hakoniwa.generic.landing-gear-mount
    status: compatible
    description: Snap landing gear to its frame mount; pose is fixed.
    adjustment:
      translation_axes: []
      rotation_axes: []
    metadata: {scope: simulation_only}

  - id: generic-accessory-mount
    provider_interface: hakoniwa.generic.accessory-mount
    consumer_interface: hakoniwa.generic.accessory-mount
    status: compatible
    description: Snap an accessory to the frame accessory zone, then allow local adjustment.
    adjustment:
      translation_axes: [x, y, z]
      rotation_axes: [roll, pitch, yaw]
      translation_limits_m: [0.10, 0.10, 0.08]
      rotation_limits_deg: [180, 180, 180]
    metadata: {scope: simulation_only}
